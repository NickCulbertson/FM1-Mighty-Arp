# Mighty Arp's build settings (tools/build.py)
name = "MightyArp"             # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_6279"       # package identity, Mighty Arp's own (MBPX on a phone keypad): dev FM-1_627900, releases FM-1_6279XXYY (tools/build.py: from 1.3, FM-1_62790103, 8 digits, the Firmware Hub's longest; 1.1 and 1.2 were FM-1_6279XXYYZZ, 1.0 FM-1_62791001010000)
usb_manufacturer = "Nick Culbertson"
usb_product = "Mighty Arp FM-1"
o2 = ["dsp/engine.c"]          # the sound, compiled at -O2 (the unity build is -Os)
words = "words.tsv"
ble = false                    # Bluetooth MIDI: off for now (true adds it, with OBJ_BLE in app.h)
cpu2 = true                    # the second core renders part of the voices
cpu2_fallback = true           # a unit whose second core misreads: one core until power-off, not a restart
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "An FM synth with a chance arpeggiator and a step sequencer, for generative playing"
repo = "https://github.com/NickCulbertson/FM1-Mighty-Arp"
licence = "MPL-2.0"
credits = "Built on fm1-base by Charles Vestal and felucca-bsp"   # a sentence for the installer's footer: what your firmware is built from
